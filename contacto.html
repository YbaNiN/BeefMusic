<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contacto · BeefMusic</title>
  <!-- Contacto vive ahora dentro de la app (index.html#/contacto). Esta página solo
       redirige para que los enlaces antiguos sigan funcionando (incluido
       contacto.html#seccion). El texto está en content/; el original, en _legacy/. -->
  <script>
    (function () {
      var section = (location.hash || "").replace(/^#/, "");
      var ok = /^[\w-]{1,60}$/.test(section);
      location.replace("index.html#/contacto" + (ok ? "?s=" + section : ""));
    })();
  </script>
  <style>body{margin:0;background:#09090b;color:#a1a1aa;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}</style>
</head>
<body>
  <p>Abriendo Contacto… <a href="index.html#/contacto" style="color:#ff3358">Abrir</a></p>
</body>
</html>
