<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BeefMusic — Canciones</title>
  <!-- Canciones vive ahora dentro de la app (index.html). Esta página solo
       redirige para que los enlaces antiguos (notificaciones, comunidad,
       canciones.html?song=ID) sigan funcionando. Original en _legacy/. -->
  <script>
    (function () {
      var song = new URLSearchParams(location.search).get("song");
      location.replace("index.html#/canciones" + (song ? "?song=" + encodeURIComponent(song) : ""));
    })();
  </script>
  <style>body{margin:0;background:#09090b;color:#a1a1aa;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}</style>
</head>
<body>
  <p>Abriendo canciones… <a href="index.html#/canciones" style="color:#ff3358">Entrar</a></p>
</body>
</html>
