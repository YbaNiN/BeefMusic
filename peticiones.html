<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BeefMusic — Peticiones</title>
  <!-- Peticiones vive ahora dentro de la app (index.html). Esta página solo
       redirige para que los enlaces antiguos (notificaciones, filtros
       ?estado=&estilo=&soloConNick=1) sigan funcionando. Original en _legacy/. -->
  <script>
    (function () {
      var src = new URLSearchParams(location.search);
      var out = new URLSearchParams();
      if (src.get("estado")) out.set("estado", src.get("estado"));
      if (src.get("estilo")) out.set("estilo", src.get("estilo"));
      if (src.get("soloConNick") === "1") out.set("nick", "1");
      var q = out.toString();
      location.replace("index.html#/peticiones" + (q ? "?" + q : ""));
    })();
  </script>
  <style>body{margin:0;background:#09090b;color:#a1a1aa;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}</style>
</head>
<body>
  <p>Abriendo peticiones… <a href="index.html#/peticiones" style="color:#ff3358">Entrar</a></p>
</body>
</html>
